<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Pilot</title>
    <!--
      样式在 main.ts 里通过 import 引入。
      不用 <link>：构建后源路径不会被打包器改写，会变成死链，
      页面于是回退到浏览器默认样式（字体、间距全丢）。
    -->
  </head>
  <body>
    <main class="pop">
      <!--
        顶栏一行放完：品牌、全部执行、更多。
        「全部执行」只做当前 tab 平台的待办（测验、作业、考试里能替你做的那部分），
        与每行悬停现身的「执行」配成一对：全部 vs 单条。
        课件不在这里——它没有截止时间，属于设置页的「课件」区。
      -->
      <header class="bar">
        <span class="brand">Study Pilot</span>
        <button id="run-now" class="btn" type="button" title="全部执行：一次完成待办中所有可代为执行的事项">全部执行</button>
        <button id="open-settings" class="btn ghost" type="button">更多</button>
      </header>

      <!--
        平台 tab：慕课 / 智慧树（规格第 13 节）。打开回到上次停留的
        平台（记忆落到「通用」时按慕课处理）；一次打开最多读一家。
        行为见 src/ui/tabs.ts。
      -->
      <div class="tabs" id="tabs" role="tablist" aria-label="平台">
        <button class="tab" role="tab" id="tab-mooc" data-tab="mooc" aria-controls="panel-mooc" aria-selected="false" tabindex="-1" type="button">慕课</button>
        <button class="tab" role="tab" id="tab-zhihuishu" data-tab="zhihuishu" aria-controls="panel-zhihuishu" aria-selected="false" tabindex="-1" type="button">智慧树</button>
      </div>

      <!--
        状态行：**当前 tab 平台**的执行进度与结果（平台状态相互独立，切 tab 即换内容）
        ——放在 tab 之下：状态跟着它的主体（平台独立后不再是「全局一轮」的横幅）。
        文字单独一个元素：setText 会整体改写它，按钮不能住在里面。
      -->
      <div id="state-line" class="state is-blank">
        <span id="state-text" class="state-text"></span>
        <!-- 失败的「下一步」：平台在错误上附带 action 时现身（如撞门的「打开验证页」）。
             控件注册在 controls.css（.state-action）；显隐由 hidden 属性驱动。 -->
        <a id="state-action" class="state-action" hidden target="_blank" rel="noreferrer"></a>
        <button id="stop-run" class="state-stop" type="button" title="停止执行：不再发出新的写入请求">停止</button>
      </div>

      <section class="tab-panel" role="tabpanel" id="panel-mooc" aria-labelledby="tab-mooc" data-tab="mooc" hidden>
        <!--
          待办区先放块状骨架（一块）：弹窗每次打开都要拉一次最新数据（约两秒），
          落定时整体换内容。写入第一份数据时被替换。
        -->
        <div id="todo-text" class="todo is-loading">
          <span class="skeleton skeleton-block is-tall" aria-hidden="true"></span>
        </div>
      </section>

      <!--
        智慧树：待办＝未完成的视频单元（没有截止时间概念，列出的就是还要看的）。
        与慕课同样先放块状骨架（一块），落定时整体换内容。
      -->
      <section class="tab-panel" role="tabpanel" id="panel-zhihuishu" aria-labelledby="tab-zhihuishu" data-tab="zhihuishu" hidden>
        <div id="zhs-todo-text" class="todo is-loading">
          <span class="skeleton skeleton-block is-tall" aria-hidden="true"></span>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
