<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Pilot</title>
    <!--
      样式在 main.ts 里通过 import 引入。
      不用 <link>：构建后源路径不会被打包器改写，会变成死链，
      页面于是回退到浏览器默认样式（字体、间距全丢）。
    -->
  </head>
  <body>
    <main class="pop">
      <!--
        顶栏一行放完：品牌、全部执行、更多。
        「全部执行」只做待办（测验、作业、考试里能替你做的那部分），
        与每行悬停现身的「执行」配成一对：全部 vs 单条。
        课件不在这里——它没有截止时间，属于设置页的「课件」区。
      -->
      <header class="bar">
        <span class="brand">Study Pilot</span>
        <button id="run-now" class="act" type="button" title="全部执行：把待办里能替你做的一次做完">全部执行</button>
        <button id="open-settings" class="act quiet" type="button">更多</button>
      </header>

      <!--
        状态行：执行进度与结果；右侧「停止」只在一轮进行时现身（.state.is-running）。
        文字单独一个元素：setText 会整体改写它，按钮不能住在里面。
      -->
      <div id="state-line" class="state is-blank">
        <span id="state-text" class="state-text"></span>
        <button id="stop-run" class="state-stop" type="button" title="停止执行：不再发新的写请求">停止</button>
      </div>

      <!--
        待办区先放一句加载提示。
        弹窗每次打开都会拉取最新数据，那是一次网络往返，约两秒。期间这里
        留空的话，用户看到的是一个空白面板，无从判断是在读取还是扩展坏了。
        写入第一份数据时会被覆盖。
      -->
      <div id="todo-text" class="todo is-loading">正在获取最新数据</div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
