<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Pilot 看板</title>
    <!-- 与设置页一样在独立标签页打开：看板要横向铺开，嵌在小弹窗里读不了 -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <h1>看板</h1>
        <p class="lede">
          各平台各课程的任务。数据来自本地快照，<strong>打开本页不会向平台发请求</strong>。
        </p>
      </header>

      <!--
        筛选放在正文之前：看板默认只看「未完成」与「失败」，
        因此这两条不是可选项而是默认视图的一部分，用户想全看时才去改。
      -->
      <div class="filters">
        <label class="filter">
          课程
          <select id="course"></select>
        </label>
        <label class="filter">
          类别
          <select id="kind"></select>
        </label>
        <label class="filter">
          做法
          <select id="mode"></select>
        </label>
        <label class="filter">
          状态
          <select id="state"></select>
        </label>
        <button id="reload" class="quiet" type="button">重读快照</button>
        <span id="fetched" class="fetched"></span>
      </div>

      <div id="app"></div>

      <p class="colophon">STUDYPILOT / MOOC ENHANCER</p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
