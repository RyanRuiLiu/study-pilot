<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Pilot 看板</title>
    <!-- 与设置页一样在独立标签页打开：看板要横向铺开，嵌在小弹窗里读不了 -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <div class="sp sheet">
      <header class="masthead">
        <h1>看板</h1>
        <!--
          这一句必须与行为一致：打开本页只读本地快照。
          单元明细要读平台，而它放在按钮后面，只有点了才发请求，因此文案点名了那个按钮。
        -->
        <p class="lede">
          各平台各课程的任务。任务列表来自本地快照，<strong>打开本页不会向平台发请求</strong>；
          单元明细里的「读取最新明细」会向平台读一次。
        </p>
      </header>

      <!--
        各平台自己的分区。外壳只给容器与标题：筛选、清单、明细、按钮都由平台渲染，
        因为它们的字段与说法各平台不同（见 src/platforms/*/views.ts）。
      -->
      <div id="platforms"></div>
      <p class="colophon">STUDYPILOT / MOOC ENHANCER</p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
