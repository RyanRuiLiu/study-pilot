<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Pilot 设置</title>
    <!--
      设置页在独立标签页中打开，而不是嵌进扩展管理页的小弹窗。
      不声明这一条的话，WXT 生成的 manifest 会写成 open_in_tab: false，
      即便 wxt.config.ts 里写的是 true——entrypoint 自己的声明优先。
      嵌在小弹窗里时页面宽度只有约 600px，表单会被压成一条窄栏。
    -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <h1>设置</h1>
        <p class="lede">改动会立即保存。</p>
      </header>

      <div class="layout">
        <!--
          左侧一栏：分区导航 + 页脚操作。
          设置页有七个分区、页面上千像素长，没有导航就只能一路滚到底找某一项。
          导航由 main.ts 依据实际渲染出的分区生成，两边不会脱节。

          恢复默认与版本号放在这一栏的底部，跟着导航一起吸顶：
          它们是整页范围的操作（不是某一个分区里的设置），放在正文末尾时
          要滚过七个分区才够得着；而版本号是「我现在用的是哪一版」，
          排查问题时最常要用，顺手能看见比埋在页脚有用。
        -->
        <div class="rail">
          <nav id="toc" class="toc" aria-label="设置分区"></nav>

          <div class="rail-foot">
            <button id="reset" class="quiet" type="button">恢复默认设置</button>
            <p id="version" class="version"></p>
          </div>
        </div>

        <div id="app"></div>
      </div>

      <p class="colophon">STUDYPILOT / MOOC ENHANCER</p>
    </div>

    <!-- 提示条。放在内容之外，浮在底部居中，不占布局位置 -->
    <span id="toast" class="toast" role="status" aria-live="polite"></span>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
